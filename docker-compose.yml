version: "3.9"

services:
  orpheus-fastapi:
    container_name: orpheus-fastapi
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "5005:5005"
    env_file:
      - .env
    environment:
      - ORPHEUS_API_URL=http://llama-cpp-server:5006/v1/completions
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:2048,expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '8gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    depends_on:
      llama-cpp-server:
        condition: service_started

  llama-cpp-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-server
    ports:
      - "5006:5006"
    volumes:
      - ./models:/models
    env_file:
      - .env
    environment:
      # Force use of cuBLAS for faster matmuls
      - GGML_CUDA_FORCE_CUBLAS=1
      - CUDA_VISIBLE_DEVICES=0
      - GGML_CUDA_FORCE_MMQ=1
      - GGML_CUDA_DMMV_X=1024
      - GGML_CUDA_MMV_Y=1024
      - GGML_CUDA_FORCE_F16=1
            # CUDA tuning
      - CUDA_VISIBLE_DEVICES=0
      - GGML_CUDA_PEER_MAX_BATCH_SIZE=8000
      - LLAMA_CUDA_HOST_BUFFER=16384         # increase host–GPU buffer (MiB)
      # Memory management
      - LLAMA_MMAP=1 
      - GGML_CUDA_SPLIT_TENSORS=1  # Add this for more efficient tensor splitting
      - GGML_TENSOR_SPLIT_MODE=row  # Add this for better tensor distribution
      - GGML_CUDA_COMPUTE_CAPABILITY=8
      - GGML_CUDA_NO_FUSED_MLP=0


    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '24gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    command: >
      -m /models/model.gguf
      --host ${LLAMA_ARG_HOST:-0.0.0.0}
      --port ${LLAMA_ARG_PORT:-5006}
      --n-gpu-layers 29                     
      --threads 6                                                 
      --batch-size 8192                         
      --ubatch-size 8192                 
      --ctx-size 16834
      --cont-batching
      --timeout 100
      --mlock
      --flash-attn
      --parallel 8
      --numa numactl
      --threads-http 2  
                       

  model-init:
    image: curlimages/curl:latest
    user: ${UID}:${GID}
    volumes:
      - ./models:/app/models
    working_dir: /app
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
    command: >
      sh -c '
      # Extract filename from URL
      MODEL_FILENAME=$(basename "${ORPHEUS_MODEL_URL}")
      
      # Check if model file already exists
      if [ ! -f "/app/models/model.gguf" ]; then
        echo "Downloading model file: ${MODEL_FILENAME}..."
        echo "From URL: ${ORPHEUS_MODEL_URL}"
        
        # Download with optional HuggingFace authentication
        if [ -n "${HUGGINGFACE_TOKEN}" ]; then
          echo "Using HuggingFace authentication token"
          wget --header="Authorization: Bearer ${HUGGINGFACE_TOKEN}" -O "/app/models/model.gguf" "${ORPHEUS_MODEL_URL}"
        else
          wget -O "/app/models/model.gguf" "${ORPHEUS_MODEL_URL}"
        fi
        
        echo "Model downloaded successfully as model.gguf"
      else
        echo "Model file already exists: model.gguf"
      fi'
    restart: "no"
