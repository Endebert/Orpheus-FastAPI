version: "3.9"

services:
  orpheus-fastapi:
    container_name: orpheus-fastapi
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "5005:5005"
    env_file:
      - .env
    environment:
      - ORPHEUS_API_URL=http://llama-cpp-server:5006/v1/completions
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:2048,expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '8gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    depends_on:
      llama-cpp-server:
        condition: service_started
      model-converter:
        condition: service_completed_successfully

  llama-cpp-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-server
    ports:
      - "5006:5006"
    volumes:
      - ./models:/models
      - ./scripts/llama_server_entrypoint.sh:/app/entrypoint.sh:ro
    env_file:
      - .env
    environment:
#      # CUDA optimization for 16-bit models
#      - CUDA_VISIBLE_DEVICES=0
#      - GGML_CUDA_FORCE_CUBLAS=1
#      - GGML_CUDA_NO_PEER_COPY=0
#      - LLAMA_CUDA_KQUANTS=0  # Disable k-quants for fp16
#      # Memory management for larger models
#      - LLAMA_MMAP=1
#      - GGML_CUDA_HOST_BUFFER=32768  # Increased for fp16
#      - GGML_CUDA_SPLIT_TENSORS=1
#      - GGML_TENSOR_SPLIT_MODE=layer  # Better for fp16
#      # Performance tuning
#      - LLAMA_THREADS=${LLAMA_THREADS:-8}
#      - LLAMA_BATCH_SIZE=${LLAMA_BATCH_SIZE:-32768}
#      - LLAMA_UBATCH_SIZE=${LLAMA_UBATCH_SIZE:-16384}
#      - LLAMA_CTX_SIZE=${LLAMA_CTX_SIZE:-49152}
#      - LLAMA_PARALLEL=${LLAMA_PARALLEL:-4}
#      - LLAMA_THREADS_HTTP=${LLAMA_THREADS_HTTP:-4}
      # Force use of cuBLAS for faster matmuls
      - GGML_CUDA_FORCE_CUBLAS=1
      - CUDA_VISIBLE_DEVICES=0
      - GGML_CUDA_FORCE_MMQ=1
      - GGML_CUDA_DMMV_X=1024
      - GGML_CUDA_MMV_Y=1024
      - GGML_CUDA_FORCE_F16=1
      # CUDA tuning
      - CUDA_VISIBLE_DEVICES=0
      - GGML_CUDA_PEER_MAX_BATCH_SIZE=8000
      - LLAMA_CUDA_HOST_BUFFER=16384         # increase host–GPU buffer (MiB)
      # Memory management
      - LLAMA_MMAP=1
      - GGML_CUDA_SPLIT_TENSORS=1  # Add this for more efficient tensor splitting
      - GGML_TENSOR_SPLIT_MODE=row  # Add this for better tensor distribution
      - GGML_CUDA_COMPUTE_CAPABILITY=8
      - GGML_CUDA_NO_FUSED_MLP=0

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '24gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    depends_on:
      model-converter:
        condition: service_completed_successfully
        required: false
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]  
                       

  model-converter:
    build:
      context: .
      dockerfile: Dockerfile.converter
    container_name: model-converter
    volumes:
      - ./models:/models
    env_file:
      - .env
    environment:
      - ORPHEUS_HF_REPO=${ORPHEUS_HF_REPO}
      - ORPHEUS_MODEL_TYPE=${ORPHEUS_MODEL_TYPE:-fp16}
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 16G
    profiles:
      - hf-convert
